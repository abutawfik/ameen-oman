name: CI

on:
  push:
    branches: [main]

jobs:
  test-and-bump:
    # Skip when triggered by the bot's own BUILD-bump commit (prevents infinite loop)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Bump BUILD number
        run: node scripts/bump-version.mjs build

      - name: Commit BUILD bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(ci): bump BUILD [skip ci]" || echo "Nothing to commit"
          git push
